services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${REVERB_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - chrome
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    chrome:
        image: 'ghcr.io/browserless/chromium:latest'
        environment:
            CONCURRENT: '${BROWSER_CONCURRENT:-5}'
            TIMEOUT: '${BROWSER_SESSION_TIMEOUT:-60000}'
        networks:
            - sail
    # Audio studio engines. They start with COMPOSE_PROFILES=audio (set in .env.example).
    phonon:
        image: 'ghcr.io/gradium-ai/ptts-openai-server:${PHONON_VERSION:-latest}'
        profiles: [audio]
        environment:
            PTTS_LANG: '${PTTS_LANG:-en}'
            PTTS_QUANT: q8
            # Empty serves Phonon 31m English; set hf://owner/name[@revision] for another model.
            PTTS_MODEL: '${PTTS_MODEL:-}'
            HF_TOKEN: '${HF_TOKEN:-}'
            HF_HOME: /home/phonon/.cache/huggingface
        volumes:
            - 'sail-phonon:/home/phonon/.cache/huggingface'
        networks:
            - sail
    # A second speech model is a second server; add its URL to PHONON_URLS.
    # phonon-fr:
    #     image: 'ghcr.io/gradium-ai/ptts-openai-server:${PHONON_VERSION:-latest}'
    #     profiles: [audio]
    #     environment:
    #         PTTS_LANG: fr
    #         PTTS_QUANT: q8
    #         PTTS_MODEL: 'hf://gradium/phonon-40m-fr'
    #         HF_TOKEN: '${HF_TOKEN:-}'
    #         HF_HOME: /home/phonon/.cache/huggingface
    #     volumes:
    #         - 'sail-phonon:/home/phonon/.cache/huggingface'
    #     networks:
    #         - sail
    musicgen:
        build:
            context: ./services/musicgen
        profiles: [audio]
        environment:
            MUSICGEN_MODEL: '${MUSICGEN_MODEL:-facebook/musicgen-small}'
            MUSICGEN_MAX_SECONDS: '${MUSICGEN_MAX_SECONDS:-30}'
            HF_TOKEN: '${HF_TOKEN:-}'
        volumes:
            - 'sail-huggingface:/cache/huggingface'
        networks:
            - sail
    diffsinger:
        build:
            context: ./services/diffsinger
        profiles: [audio]
        environment:
            DIFFSINGER_TIMEOUT: '${DIFFSINGER_TIMEOUT:-900}'
        volumes:
            # Your DiffSinger voices (experiments, vocoder and voices.json); see storage/diffsinger/README.md.
            - './storage/diffsinger:/opt/DiffSinger/checkpoints'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-phonon:
        driver: local
    sail-huggingface:
        driver: local
